<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connections</title>
<meta name="description" content="Create four groups of four.">
<meta name="theme-color" content="#f7f7f2">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%82</text></svg>">
<style>
  :root {
    --bg: #f7f7f2;
    --fg: #121212;
    --muted: #6b6b6b;
    --tile: #efefe6;
    --tile-fg: #121212;
    --selected: #5a594e;
    --selected-fg: #ffffff;
    --line: #d9d9d0;
    --yellow: #f9df6d;
    --green: #a0c35a;
    --blue: #b0c4ef;
    --purple: #ba81c5;
    --band-fg: #121212;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --fg: #f2f2ee;
      --muted: #a0a0a0;
      --tile: #2b2b31;
      --tile-fg: #f2f2ee;
      --selected: #7a7a8c;
      --line: #3a3a42;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px 12px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 520px; }
  header { text-align: center; margin-bottom: 14px; }
  h1 { font-size: 1.35rem; letter-spacing: .02em; margin: 0 0 4px; }
  .subtitle { margin: 0; color: var(--muted); font-size: .9rem; }
  hr.rule { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

  #gate { text-align: center; margin: 26px 0; }
  .gate-lead { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }
  #gate-form { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #gate-input {
    font: inherit;
    font-size: 1rem;
    letter-spacing: .18em;
    text-align: center;
    padding: 11px 14px;
    width: 190px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
    color: var(--fg);
  }
  #gate-input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  #solved { display: grid; gap: 8px; margin-bottom: 8px; }
  #solved:empty { margin-bottom: 0; }
  .band {
    border-radius: 6px;
    padding: 12px 10px;
    text-align: center;
    color: var(--band-fg);
    animation: drop .35s ease;
  }
  .band .name { font-weight: 800; text-transform: uppercase; font-size: .82rem; letter-spacing: .03em; }
  .band .words { font-size: .82rem; margin-top: 2px; }
  .d0 { background: var(--yellow); }
  .d1 { background: var(--green); }
  .d2 { background: var(--blue); }
  .d3 { background: var(--purple); }

  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile {
    appearance: none;
    border: 0;
    border-radius: 6px;
    background: var(--tile);
    color: var(--tile-fg);
    font: inherit;
    font-weight: 700;
    font-size: clamp(.62rem, 3.1vw, .95rem);
    text-transform: uppercase;
    letter-spacing: .01em;
    aspect-ratio: 1 / 1;
    padding: 4px 2px;
    cursor: pointer;
    overflow-wrap: anywhere;
    transition: transform .08s ease, background .12s ease, color .12s ease;
  }
  .tile.len-long { font-size: clamp(.5rem, 2.5vw, .78rem); }
  .tile.len-xlong { font-size: clamp(.44rem, 2.1vw, .68rem); }
  .tile:active { transform: scale(.95); }
  .tile[aria-pressed="true"] { background: var(--selected); color: var(--selected-fg); }
  .tile:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .tile.shake { animation: shake .5s ease; }
  .tile.pop { animation: pop .3s ease; }

  /* The toast floats just above the board, as it does in the real game. */
  .toast-slot { position: relative; height: 0; }
  .toast {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    background: var(--fg);
    color: var(--bg);
    font-size: .82rem;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 5px;
    z-index: 2;
    animation: drop .18s ease;
  }

  .mistakes { text-align: center; color: var(--muted); font-size: .85rem; margin: 18px 0 14px; }
  .dots { display: inline-flex; gap: 7px; vertical-align: middle; margin-left: 4px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--selected); }

  .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn {
    appearance: none;
    border: 1px solid var(--fg);
    background: transparent;
    color: var(--fg);
    border-radius: 999px;
    padding: 11px 18px;
    font: inherit;
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--fg); color: var(--bg); }
  .btn.primary:disabled { background: transparent; color: var(--fg); }
  .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  #endcard { text-align: center; margin-top: 18px; }
  #endcard h2 { font-size: 1.05rem; margin: 0 0 6px; }
  .grid-share { font-size: 1.25rem; line-height: 1.25; margin: 8px 0 14px; white-space: pre; }
  footer { margin-top: 22px; text-align: center; color: var(--muted); font-size: .8rem; }
  footer select { font: inherit; font-size: .8rem; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

  .haptic-probe {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes pop {
    0%, 100% { transform: none; }
    50% { transform: translateY(-9px); }
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Connections</h1>
    <p class="subtitle">Create four groups of four!</p>
  </header>
  <hr class="rule">

  <section id="gate" hidden>
    <p class="gate-lead">This one's private. Enter the password to play.</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" type="password" inputmode="numeric" autocomplete="off"
             aria-label="Password" placeholder="••••••••">
      <button class="btn primary" id="gate-submit" type="submit">Enter</button>
    </form>
    <p id="gate-error" class="message" role="status" aria-live="polite"></p>
  </section>

  <div id="game" hidden>
  <section id="solved" aria-live="polite"></section>
  <div class="toast-slot"><div id="toast" class="toast" role="status" aria-live="polite" hidden></div></div>
  <div id="board" class="board" role="group" aria-label="Puzzle board"></div>

  <div id="status">
    <p class="mistakes">Mistakes remaining: <span id="dots" class="dots"></span></p>
  </div>

  <div class="controls" id="controls">
    <button class="btn" id="shuffle" type="button">Shuffle</button>
    <button class="btn" id="deselect" type="button" disabled>Deselect All</button>
    <button class="btn primary" id="submit" type="button" disabled>Submit</button>
  </div>

  <section id="endcard" hidden>
    <h2 id="endtitle"></h2>
    <div class="grid-share" id="share"></div>
    <div class="controls">
      <button class="btn" id="copy" type="button">Copy results</button>
      <button class="btn primary" id="again" type="button">Play again</button>
    </div>
  </section>

  </div>

  <footer>
    <div id="picker-wrap" hidden>
      <label for="picker">Puzzle: </label>
      <select id="picker"></select>
    </div>
  </footer>
</main>

<input type="checkbox" id="haptic" switch class="haptic-probe" tabindex="-1" aria-hidden="true">

<script>
(function () {
  "use strict";

  var WORDS_PER_GROUP = 4;
  var MAX_MISTAKES = 4;
  var SQUARES = ["\u{1F7E8}", "\u{1F7E9}", "\u{1F7E6}", "\u{1F7EA}"];
  var STORAGE_PREFIX = "connections:v1:";

  var dataEl = document.getElementById("puzzle-data");
  var raw = dataEl.textContent.trim();
  var ENCRYPTED = dataEl.getAttribute("data-format") === "aes-gcm";
  var ITERATIONS = parseInt(dataEl.getAttribute("data-iterations"), 10) || 250000;
  var SALT_BYTES = 16;
  var NONCE_BYTES = 12;
  var PUZZLES;

  function bytesFromBase64(text) {
    return Uint8Array.from(atob(text), function (c) { return c.charCodeAt(0); });
  }

  var el = {
    title: document.getElementById("title"),
    solved: document.getElementById("solved"),
    board: document.getElementById("board"),
    toast: document.getElementById("toast"),
    dots: document.getElementById("dots"),
    status: document.getElementById("status"),
    controls: document.getElementById("controls"),
    shuffle: document.getElementById("shuffle"),
    deselect: document.getElementById("deselect"),
    submit: document.getElementById("submit"),
    endcard: document.getElementById("endcard"),
    endtitle: document.getElementById("endtitle"),
    share: document.getElementById("share"),
    copy: document.getElementById("copy"),
    again: document.getElementById("again"),
    pickerWrap: document.getElementById("picker-wrap"),
    picker: document.getElementById("picker"),
    gate: document.getElementById("gate"),
    gateForm: document.getElementById("gate-form"),
    gateInput: document.getElementById("gate-input"),
    gateSubmit: document.getElementById("gate-submit"),
    gateError: document.getElementById("gate-error"),
    game: document.getElementById("game"),
    haptic: document.getElementById("haptic")
  };

  var puzzle, board, selected, solved, mistakes, guesses;
  var busy = false;  // true while a guess animation is playing

  // --- sound and haptics ------------------------------------------------
  // The click is synthesized, so there is no audio file to load. Browsers
  // only allow sound after a user gesture; the password screen is the first
  // one, so audio is armed by the time the board appears.
  var audio = null;

  function ensureAudio() {
    try {
      if (!audio) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audio = new Ctx();
      }
      if (audio.state === "suspended") audio.resume();
    } catch (err) {
      audio = null;
    }
    return audio;
  }

  function tick(frequency) {
    var ctx = ensureAudio();
    if (!ctx) return;
    try {
      var now = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(frequency, now);
      osc.frequency.exponentialRampToValueAtTime(frequency * 0.6, now + 0.05);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } catch (err) { /* never let a sound break the game */ }
  }

  // Safari renders <input switch> as a native toggle and plays a system
  // haptic when it flips — the only route to vibration iOS gives a web page.
  // Everywhere else this feature-detects to false and stays silent.
  var CAN_BUZZ = (function () {
    try { return "switch" in document.createElement("input"); } catch (err) { return false; }
  })();

  function buzz() {
    if (!CAN_BUZZ || !el.haptic) return;
    try { el.haptic.click(); } catch (err) { /* ignore */ }
  }

  // --- helpers ----------------------------------------------------------
  function shuffled(list) {
    var out = list.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  function allWords(p) {
    return p.groups.reduce(function (acc, g) { return acc.concat(g.words); }, []);
  }

  function groupOf(word) {
    for (var i = 0; i < puzzle.groups.length; i++) {
      if (puzzle.groups[i].words.indexOf(word) !== -1) return i;
    }
    return -1;
  }

  function overlap(group, words) {
    return words.filter(function (w) { return group.words.indexOf(w) !== -1; }).length;
  }

  function isLost() { return mistakes >= MAX_MISTAKES; }
  function isWon() { return solved.length === puzzle.groups.length && !isLost(); }
  function isOver() { return isWon() || isLost(); }

  // --- persistence ------------------------------------------------------
  function storageKey() { return STORAGE_PREFIX + puzzle.title; }

  function save() {
    try {
      localStorage.setItem(storageKey(), JSON.stringify({
        board: board, solved: solved, mistakes: mistakes, guesses: guesses
      }));
    } catch (err) { /* private mode, blocked storage - play on */ }
  }

  function restore() {
    try {
      var saved = JSON.parse(localStorage.getItem(storageKey()));
      if (!saved || !Array.isArray(saved.board)) return false;
      var expected = allWords(puzzle).slice().sort().join("|");
      var got = saved.board.concat(saved.solved.reduce(function (acc, i) {
        return acc.concat(puzzle.groups[i].words);
      }, [])).sort().join("|");
      if (expected !== got) return false;
      board = saved.board;
      solved = saved.solved;
      mistakes = saved.mistakes;
      guesses = saved.guesses || [];
      return true;
    } catch (err) {
      return false;
    }
  }

  function clearSaved() {
    try { localStorage.removeItem(storageKey()); } catch (err) { /* ignore */ }
  }

  // --- rendering --------------------------------------------------------
  function sizeClass(word) {
    if (word.length > 11) return "tile len-xlong";
    if (word.length > 8) return "tile len-long";
    return "tile";
  }

  function renderSolved() {
    el.solved.innerHTML = "";
    solved.forEach(function (index) {
      var group = puzzle.groups[index];
      var band = document.createElement("div");
      band.className = "band d" + group.difficulty;
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = group.name;
      var words = document.createElement("div");
      words.className = "words";
      words.textContent = group.words.join(", ");
      band.appendChild(name);
      band.appendChild(words);
      el.solved.appendChild(band);
    });
  }

  function renderBoard() {
    el.board.innerHTML = "";
    board.forEach(function (word) {
      var tile = document.createElement("button");
      tile.type = "button";
      tile.className = sizeClass(word);
      tile.textContent = word;
      tile.setAttribute("aria-pressed", selected.indexOf(word) !== -1 ? "true" : "false");
      tile.addEventListener("click", function () { toggle(word); });
      el.board.appendChild(tile);
    });
  }

  function renderStatus() {
    el.dots.innerHTML = "";
    for (var left = 0; left < Math.max(0, MAX_MISTAKES - mistakes); left++) {
      var dot = document.createElement("span");
      dot.className = "dot";
      el.dots.appendChild(dot);
    }
    el.submit.disabled = selected.length !== WORDS_PER_GROUP || isOver() || busy;
    el.deselect.disabled = selected.length === 0 || isOver();
    el.shuffle.disabled = isOver();
  }

  var toastTimer = null;

  function say(text) {
    clearTimeout(toastTimer);
    if (!text) { el.toast.hidden = true; return; }
    el.toast.textContent = text;
    el.toast.hidden = false;
    toastTimer = setTimeout(function () { el.toast.hidden = true; }, 1800);
  }

  function tilesFor(words) {
    return Array.prototype.filter.call(el.board.children, function (node) {
      return words.indexOf(node.textContent) !== -1;
    });
  }

  function animate(words, name) {
    tilesFor(words).forEach(function (tile, index) {
      tile.classList.remove(name);
      void tile.offsetWidth;
      tile.style.animationDelay = name === "pop" ? index * 50 + "ms" : "0ms";
      tile.classList.add(name);
    });
  }

  function shareGrid() {
    return guesses.map(function (guess) {
      return guess.map(function (word) { return SQUARES[puzzle.groups[groupOf(word)].difficulty]; }).join("");
    }).join("\n");
  }

  function renderEnd() {
    el.status.hidden = true;
    el.controls.hidden = true;
    el.endcard.hidden = false;
    el.endtitle.textContent = isWon()
      ? (mistakes === 0 ? "Perfect!" : "You got it!")
      : "Next time!";
    el.share.textContent = shareGrid();
  }

  // --- play -------------------------------------------------------------
  function toggle(word) {
    if (busy || isOver()) return;
    var at = selected.indexOf(word);
    if (at !== -1) {
      selected.splice(at, 1);
      tick(440);
    } else if (selected.length < WORDS_PER_GROUP) {
      selected.push(word);
      tick(660);
    } else {
      return;
    }
    say("");
    renderBoard();
    renderStatus();
  }

  function alreadyGuessed(words) {
    var key = words.slice().sort().join("|");
    return guesses.some(function (guess) { return guess.slice().sort().join("|") === key; });
  }

  function submit() {
    if (busy || selected.length !== WORDS_PER_GROUP || isOver()) return;
    if (alreadyGuessed(selected)) {
      say("Already guessed!");
      return;
    }

    var best = -1;
    var bestOverlap = -1;
    puzzle.groups.forEach(function (group, index) {
      if (solved.indexOf(index) !== -1) return;
      var score = overlap(group, selected);
      if (score > bestOverlap) { bestOverlap = score; best = index; }
    });

    var guess = selected.slice();
    guesses.push(guess);

    if (bestOverlap === WORDS_PER_GROUP) {
      // The real game bounces the four tiles before they become a band.
      busy = true;
      animate(guess, "pop");
      setTimeout(function () {
        solved.push(best);
        board = board.filter(function (word) { return guess.indexOf(word) === -1; });
        selected = [];
        busy = false;
        renderSolved();
        renderBoard();
        renderStatus();
        save();
        if (isOver()) renderEnd();
      }, 480);
      return;
    }

    mistakes += 1;
    // Only "one away" earns a message; a plain miss just shakes, as in the
    // real game, and the dots carry the news.
    if (bestOverlap === WORDS_PER_GROUP - 1) say("One away…");
    animate(guess, "shake");
    buzz();
    renderStatus();
    save();

    if (isLost()) {
      busy = true;
      setTimeout(function () {
        revealRest();
        busy = false;
        renderSolved();
        renderBoard();
        renderStatus();
        save();
        renderEnd();
      }, 600);
    }
  }

  function revealRest() {
    puzzle.groups.forEach(function (group, index) {
      if (solved.indexOf(index) === -1) solved.push(index);
    });
    solved.sort(function (a, b) {
      return puzzle.groups[a].difficulty - puzzle.groups[b].difficulty;
    });
    board = [];
    selected = [];
  }

  // --- setup ------------------------------------------------------------
  function start(index, fresh) {
    puzzle = PUZZLES[index];
    el.title.textContent = puzzle.title;
    document.title = puzzle.title;
    selected = [];
    el.status.hidden = false;
    el.controls.hidden = false;
    el.endcard.hidden = true;
    say("");

    if (fresh) clearSaved();
    if (!fresh && restore()) {
      // picked up where the last visit left off
    } else {
      board = shuffled(allWords(puzzle));
      solved = [];
      mistakes = 0;
      guesses = [];
    }

    renderSolved();
    renderBoard();
    renderStatus();
    if (isOver()) renderEnd();
    try { localStorage.setItem(STORAGE_PREFIX + "last", String(index)); } catch (err) { /* ignore */ }
  }

  function initialIndex() {
    var param = new URLSearchParams(location.search).get("p");
    var wanted = param === null ? NaN : parseInt(param, 10) - 1;
    if (!isNaN(wanted) && wanted >= 0 && wanted < PUZZLES.length) return wanted;
    try {
      var last = parseInt(localStorage.getItem(STORAGE_PREFIX + "last"), 10);
      if (!isNaN(last) && last >= 0 && last < PUZZLES.length) return last;
    } catch (err) { /* ignore */ }
    return 0;
  }

  el.submit.addEventListener("click", submit);
  el.shuffle.addEventListener("click", function () {
    board = shuffled(board);
    renderBoard();
    save();
  });
  el.deselect.addEventListener("click", function () {
    selected = [];
    renderBoard();
    renderStatus();
  });
  el.again.addEventListener("click", function () {
    start(PUZZLES.indexOf(puzzle), true);
  });
  el.copy.addEventListener("click", function () {
    var text = puzzle.title + "\n" + shareGrid();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        el.copy.textContent = "Copied!";
        setTimeout(function () { el.copy.textContent = "Copy results"; }, 1500);
      }, function () { el.copy.textContent = "Copy failed"; });
    } else {
      el.copy.textContent = "Copy failed";
    }
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Enter") submit();
    if (event.key === "Escape") { selected = []; renderBoard(); renderStatus(); }
  });

  function buildPicker() {
    if (PUZZLES.length < 2) return;
    el.pickerWrap.hidden = false;
    PUZZLES.forEach(function (p, index) {
      var option = document.createElement("option");
      option.value = String(index);
      option.textContent = p.title;
      el.picker.appendChild(option);
    });
    el.picker.addEventListener("change", function () {
      start(parseInt(el.picker.value, 10), false);
    });
  }

  // --- the password gate ------------------------------------------------
  // The puzzles are AES-GCM ciphertext; the password is the key, so a wrong
  // answer doesn't fail a comparison, it fails to decrypt anything.
  function decryptPuzzles(password) {
    var blob = bytesFromBase64(raw);
    var salt = blob.slice(0, SALT_BYTES);
    var nonce = blob.slice(SALT_BYTES, SALT_BYTES + NONCE_BYTES);
    var ciphertext = blob.slice(SALT_BYTES + NONCE_BYTES);
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) return Promise.reject(new Error("no-crypto"));

    return subtle
      .importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function (baseKey) {
        return subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      })
      .then(function (key) {
        return subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, ciphertext);
      })
      .then(function (plain) {
        return JSON.parse(new TextDecoder().decode(plain));
      });
  }

  function boot(puzzles) {
    PUZZLES = puzzles;
    el.gate.hidden = true;
    el.game.hidden = false;
    buildPicker();
    var startIndex = initialIndex();
    el.picker.value = String(startIndex);
    start(startIndex, false);
  }

  function unlock(password, quiet) {
    if (!password) return;
    el.gateSubmit.disabled = true;
    el.gateError.textContent = quiet ? "" : "Checking…";
    decryptPuzzles(password).then(function (puzzles) {
      try { localStorage.setItem(STORAGE_PREFIX + "key", password); } catch (err) { /* ignore */ }
      el.gateSubmit.disabled = false;
      el.gateError.textContent = "";
      boot(puzzles);
    }, function (error) {
      // A remembered password that no longer works just drops us at the prompt.
      try { localStorage.removeItem(STORAGE_PREFIX + "key"); } catch (err) { /* ignore */ }
      el.gateSubmit.disabled = false;
      el.gateInput.value = "";
      el.gateError.textContent = quiet
        ? ""
        : (error && error.message === "no-crypto"
            ? "This page needs to be opened over https to unlock."
            : "Wrong password.");
      if (!quiet) el.gateInput.focus();
    });
  }

  el.gateForm.addEventListener("submit", function (event) {
    event.preventDefault();
    ensureAudio();
    unlock(el.gateInput.value.trim(), false);
  });

  if (!ENCRYPTED) {
    boot(JSON.parse(new TextDecoder().decode(bytesFromBase64(raw))));
  } else {
    el.gate.hidden = false;
    var remembered = null;
    try { remembered = localStorage.getItem(STORAGE_PREFIX + "key"); } catch (err) { /* ignore */ }
    if (remembered) {
      unlock(remembered, true);
    } else {
      el.gateInput.focus();
    }
  }
})();
</script>
</body>
</html>
